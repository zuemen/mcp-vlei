# agentgateway configuration for the regulator scenario.
#
# The agent connects here instead of directly to the filing server. Its source code does not change
# — only the URL it is given. That is the claim this directory exists to substantiate.
#
# Field names and defaults below were taken from agentgateway's published configuration JSON schema
# (schema/config.json in agentgateway/agentgateway), not from prose examples.

binds:
  - port: 3000
    listeners:
      - name: mcp
        routes:
          - name: filing
            policies:
              # ---------------------------------------------------------------------------- #
              # External authorization — vlei-authz decides before the backend is reached.
              # ---------------------------------------------------------------------------- #
              extAuthz:
                host: vlei-authz:9000

                # The credential and signature live in the JSON-RPC body's `_meta`, so the body
                # must reach the authorizer. The default cap is 8192 bytes, and a chained CESR
                # ACDC exceeds that comfortably.
                #
                # allowPartialMessage stays false deliberately: a truncated credential is not a
                # smaller credential, it is an unverifiable one, and silently authorizing against
                # a fragment would be worse than failing.
                includeRequestBody:
                  maxRequestBytes: 65536
                  allowPartialMessage: false

                # Default is already `deny`; stated explicitly because it is a security property
                # and should not depend on a reader knowing the default. If the authorizer is
                # unreachable, requests are refused rather than waved through.
                failureMode: deny

                protocol:
                  http:
                    path: '"/auth/mcp"'
                    # Copied onto the request when the authorizer returns 200. These four headers
                    # are the entire interface the filing server has with vLEI.
                    includeResponseHeaders:
                      - x-vlei-lei
                      - x-vlei-role
                      - x-vlei-holder-aid
                      - x-vlei-delegate-aid

              # ---------------------------------------------------------------------------- #
              # MCP authorization — the tool boundary.
              # ---------------------------------------------------------------------------- #
              mcpAuthorization:
                # NOTE on what is expressible here. The CEL variables available at request time are
                # `mcp.tool.*` and `jwt.*`. Headers produced by external authorization are not
                # addressable, so `role == "regulatory-filing"` cannot be written at this layer —
                # it is enforced in vlei-authz, which parses the credential and already knows both
                # the tool and the role, and denies with a named failure layer first.
                #
                # What this policy contributes is a closed list of reachable tools, so a tool added
                # to the backend is not exposed by accident.
                rules:
                  - 'mcp.tool.name == "list_forms"'
                  - 'mcp.tool.name == "get_filing_status"'
                  - 'mcp.tool.name == "submit_filing"'

            backends:
              - mcp:
                  targets:
                    - name: filing-server
                      mcp:
                        host: filing-server:8081
                        path: /mcp
