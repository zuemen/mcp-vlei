# agentgateway configuration for the regulator scenario.
#
# The agent connects here instead of directly to the filing server. Its source code does not change
# — only the URL it is given. That is the claim this directory exists to substantiate.
#
# Field names follow agentgateway's documented HTTP external-authorization and MCP-authorization
# policies. Two places where they differ from what one might assume are noted below; both are real
# constraints of the current release, not simplifications.

binds:
  - port: 3000
    listeners:
      - name: mcp
        routes:
          - name: filing
            policies:
              # ---------------------------------------------------------------------------- #
              # External authorization — vlei-authz decides, before the backend is reached.
              # ---------------------------------------------------------------------------- #
              extAuthz:
                host: vlei-authz:9000
                protocol:
                  # NOTE 1 — the HTTP external-authorization protocol forwards request *headers*
                  # to the authorizer. There is no documented request-body forwarding, and the
                  # credential and signature live in the JSON-RPC body's `_meta`. The client
                  # therefore mirrors those values into `x-vlei-*` headers
                  # (`VleiClient(..., mirror_headers=True)`), and they are listed here.
                  #
                  # This does not weaken the check: the signature's digest covers the canonicalized
                  # `params`, so a mirrored header that disagrees with the body fails on the digest.
                  # If a future release forwards the body, vlei-authz already prefers it.
                  includeRequestHeaders:
                    - x-vlei-tool
                    - x-vlei-credential
                    - x-vlei-signature
                    - x-vlei-delegated-aid
                    - x-vlei-verkey
                  http:
                    path: '"/authz"'
                    # Copied onto the request when the authorizer returns 200. These four headers
                    # are the entire interface the filing server has with vLEI.
                    includeResponseHeaders:
                      - x-vlei-lei
                      - x-vlei-role
                      - x-vlei-holder-aid
                      - x-vlei-delegate-aid

              # ---------------------------------------------------------------------------- #
              # MCP authorization — defence in depth at the tool boundary.
              # ---------------------------------------------------------------------------- #
              mcpAuthorization:
                # NOTE 2 — the CEL variables available at request time are `mcp.tool.*` and `jwt.*`.
                # Headers produced by external authorization are NOT addressable here, so the rule
                # `role == "regulatory-filing"` cannot be written at this layer.
                #
                # Role enforcement therefore lives in vlei-authz, which parses the credential and
                # already knows both the tool and the role — it denies with 403 and a named layer
                # before the request reaches this policy. What this policy adds is a closed list of
                # reachable tools, so a tool added to the backend is not exposed by accident.
                #
                # If a release adds ext-authz response headers to the CEL environment, the role
                # check belongs here as well, and the two layers then agree by construction.
                rules:
                  - 'mcp.tool.name == "list_forms"'
                  - 'mcp.tool.name == "get_filing_status"'
                  - 'mcp.tool.name == "submit_filing"'

            backends:
              - mcp:
                  targets:
                    - name: filing-server
                      mcp:
                        host: filing-server:8081
                        path: /mcp
