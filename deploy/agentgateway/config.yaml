# agentgateway configuration for the regulator scenario. Pinned to agentgateway v1.5.0.
#
# The agent connects here instead of directly to the labor-insurance simulator. Its source code does not change
# — only the URL it is given. That is the claim this directory exists to substantiate.
#
# Field names below were checked against agentgateway v1.5.0's published configuration schema
# (schema/config.json at tag v1.5.0), and the file passes `agentgateway --validate-only`.

binds:
  - port: 3000
    listeners:
      - name: mcp
        routes:
          # ------------------------------------------------------------------------------------ #
          # Who operates this endpoint — public, and deliberately outside the extAuthz route.
          # ------------------------------------------------------------------------------------ #
          # The operator's LE credential at the RFC 8615 location, so a caller can verify who it is
          # talking to before presenting anything (mode (a); docs/GOVERNMENT.md, Stage 1). It
          # asserts nothing about the caller, so there is nothing to authorize. Served by vlei-pop
          # (v0.3), with the signature format this gateway verifies and where to challenge it.
          - name: well-known
            matches:
              - path:
                  exact: /.well-known/vlei
            policies:
              # -------------------------------------------------------------------------------- #
              # Rate limits — public callers share one small bucket; local ones never see it.
              # -------------------------------------------------------------------------------- #
              # v1.5.0's local limit is one token bucket per entry, not per client. Traffic through the
              # Cloudflare tunnel always carries cf-connecting-ip (Cloudflare sets it; a caller cannot
              # remove it), so the public gets its own bucket and a flood from outside drains only that
              # one: the console, the credential proxy and the tests on this machine keep theirs. A
              # refused request answers 429. Per-client limits need a remote rate-limit service.
              localRateLimit: &rate-limits
                conditional:
                  - condition: '"cf-connecting-ip" in request.headers'
                    maxTokens: 60
                    tokensPerFill: 60
                    fillInterval: 60s
                  - maxTokens: 600
                    tokensPerFill: 600
                    fillInterval: 60s
            backends:
              - host: vlei-pop:9100

          # The proof that the operator holds its key (v0.3): a client's challenge, answered with a
          # statement signed by the gateway's AID, which the operator's LE delegated to. Public for the
          # same reason as the route above; it signs only for this gateway's own URLs.
          - name: proof-of-possession
            matches:
              - path:
                  exact: /.well-known/vlei/pop
            policies:
              # Its own, smaller public bucket. vlei-pop signs one challenge at a time (2-3 s) with
              # four waiting; at the shared 60 a minute one public caller at 1 request/s keeps that
              # queue full, and the credential proxy's connect and re-check here get 503. Five a
              # minute bounds the public to a few seconds of signing; local callers keep 600.
              # (v1.5.0's local limit cannot be keyed per client address; see the note above.)
              localRateLimit:
                conditional:
                  - condition: '"cf-connecting-ip" in request.headers'
                    maxTokens: 5
                    tokensPerFill: 5
                    fillInterval: 60s
                  - maxTokens: 600
                    tokensPerFill: 600
                    fillInterval: 60s
            backends:
              - host: vlei-pop:9100

          - name: labor-insurance
            policies:
              # The same limits as the well-known route (and the same buckets' sizes).
              localRateLimit: *rate-limits

              # ---------------------------------------------------------------------------- #
              # External authorization — vlei-authz decides before the backend is reached.
              # ---------------------------------------------------------------------------- #
              extAuthz:
                host: vlei-authz:9001

                # agentgateway gives an authorizer 2s by default. vlei-authz reads the signer's
                # key event log and every issuer's TEL from a witness, and bounds each read at
                # VLEI_WITNESS_TIMEOUT (3s); 10s leaves room for that, so an unreachable witness
                # comes back as the named layer (`invalid_signature ... not established`) rather
                # than as this gateway's generic "external authorization failed". Both refuse.
                policies:
                  http:
                    requestTimeout: 10s

                # The credential and signature live in the JSON-RPC body's `_meta`, so the body
                # must reach the authorizer. The default cap is 8192 bytes, and a chained CESR
                # ACDC exceeds that comfortably.
                #
                # 262144, not 65536: the exported stream carries the issuers' key event logs, which
                # grow with every issuance and revocation. On 2026-09-30, after a few re-issues, an
                # ECR stream reached 66 KB and every call was refused with 413 at a 64 KB cap. (The
                # lasting fix is to present the ACDC without the logs — the verifier reads them from
                # the witnesses anyway.)
                #
                # allowPartialMessage stays false deliberately: a truncated credential is not a
                # smaller credential, it is an unverifiable one, and silently authorizing against
                # a fragment would be worse than failing.
                includeRequestBody:
                  maxRequestBytes: 262144
                  allowPartialMessage: false

                # Default is already `deny`; stated explicitly because it is a security property
                # and should not depend on a reader knowing the default. If the authorizer is
                # unreachable, requests are refused rather than waved through.
                failureMode: deny

                # gRPC (Envoy's ext_authz Check API), the schema's default, and the only wire on
                # which a refusal can be answered the way MCP clients show it to the model.
                #
                # Over HTTP ext-authz, v1.5.0 allows on any 2xx and returns any other answer as it
                # is, so a refused tools/call could only be a 403. The claude.ai connector shows a 403
                # as a bare "the connector's server returned an error": Claude never learned the
                # reason, and told the user the server was broken.
                #
                # Over gRPC, a refusal is a non-OK CheckResponse carrying its own HTTP response, and
                # the backend is never called. vlei-authz answers a refused call with HTTP 200 and
                # the call's own JSON-RPC answer — an MCP tool error whose first line is the failure
                # layer (`missing_credential: ...`). A body with no call in it is still a 403. See
                # examples/regulator/vlei-authz/grpc_check.py.
                #
                # On allow, the CheckResponse removes all six x-vlei-* headers and sets the
                # established ones, so a value a client sent under one of those names never
                # reaches the labor-insurance simulator. (The HTTP service on :9000 keeps the old
                # contract for gateways that speak only HTTP ext-authz.)
                protocol:
                  grpc: {}

            # The backend is plain HTTP: agentgateway authorizes and forwards, and the MCP server's
            # responses reach the client byte for byte.
            #
            # It was an `mcp:` backend until 2026-10-01. With the 2026-07-28 per-request envelope,
            # v1.5.0's MCP layer re-frames what the server answers: a JSON response becomes a
            # text/event-stream, and the tools/list result loses its
            # `_meta["io.modelcontextprotocol/serverInfo"]`. The official SDK client accepts that.
            # The claude.ai connector listed no tools at all — the same connector that listed and
            # called tools on the observatory, an SDK server it reached directly.
            #
            # What the MCP layer contributed is kept elsewhere:
            #   - The closed list of reachable tools is vlei-authz's policy.json, which refuses an
            #     unlisted tool rather than treating it as public. mcpAuthorization repeated it.
            #   - Tool names were never prefixed (prefixMode: never), so nothing changes there.
            #   - Every check, the rate limits and the identity headers are HTTP-level policies
            #     above, unchanged.
            backends:
              - host: labor-insurance-sim:8081
