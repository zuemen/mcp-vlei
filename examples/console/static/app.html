<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP × vLEI — interactive demonstration</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>MCP × vLEI</span></div>
  <div class="titles">
    <h1 data-t="app.title"></h1>
    <p data-t="app.subtitle"></p>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="lang" id="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
</header>
<p class="banner" data-t="banner.simulated"></p>

<nav class="tabs" role="tablist">
  <a class="tab" href="/story" data-t="tab.story"></a>
  <button type="button" class="tab" data-tab="tour" role="tab" data-t="tab.tour"></button>
  <button type="button" class="tab" data-tab="scenarios" role="tab" data-t="tab.scenarios"></button>
  <button type="button" class="tab" data-tab="build" role="tab" data-t="tab.build"></button>
  <a class="tab" href="/evidence" data-t="tab.evidence"></a>
</nav>

<main class="layout">
  <section class="side">
    <div class="panel" id="panel-tour" hidden></div>
    <div class="panel" id="panel-scenarios" hidden></div>
    <div class="panel" id="panel-build" hidden></div>
    <div class="who" id="who"></div>
  </section>
  <section class="result" id="result" aria-live="polite">
    <h2 data-t="result.outcome"></h2>
    <div class="outcome" id="outcome" data-status="empty"></div>
    <div class="server" id="server"></div>
    <h2 class="checks-title" data-t="result.checks"></h2>
    <p class="hint" data-t="result.checks.hint"></p>
    <ol class="checks" id="checks"></ol>
    <p class="hint small" data-t="result.checks.timing"></p>
  </section>
  <section class="middle">
    <h2 data-t="result.request"></h2>
    <p class="hint" data-t="result.request.hint"></p>
    <div id="tampered" class="tampered" hidden></div>
    <pre class="json" id="request"></pre>
  </section>
</main>

<section class="log" id="log">
  <h2 data-t="log.title"></h2>
  <p class="hint" data-t="log.hint"></p>
  <table>
    <thead><tr><th data-t="log.time"></th><th data-t="log.what"></th><th data-t="log.result"></th><th data-t="log.who"></th></tr></thead>
    <tbody></tbody>
  </table>
</section>

<footer class="foot">
  <p data-t="footer.text"></p>
  <p data-t="footer.namespace"></p>
  <p data-t="footer.source"></p>
</footer>
<script src="/app/app.js"></script>
</body>
</html>
