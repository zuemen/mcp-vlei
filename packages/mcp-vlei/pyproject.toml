[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-vlei"
version = "0.1.0"
description = "Verifiable organizational identity for MCP using GLEIF vLEI (org.gleif.vlei/identity)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mcp-vlei contributors" }]
keywords = ["mcp", "vlei", "gleif", "keri", "acdc", "identity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "mcp>=2.2.0",
  "httpx>=0.27",
  "cryptography>=42.0",
]

[project.optional-dependencies]
keri = ["keri>=1.2.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/zuemen/mcp-vlei"
Specification = "https://github.com/zuemen/mcp-vlei/blob/main/spec/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vlei"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
